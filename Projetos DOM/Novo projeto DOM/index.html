<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporizador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Temporizador de Tarefas</h1>
    <button id="btn-tema">Modo Claro/Escuro</button>
    <div class="container">
        <h2  align="left" >Adicionar nova tarefa</h2>
        <div class="linha-input">
            <input id="nomeTarefa" type="text" placeholder="Digite sua tarefa aqui">
            <button id="Adicionar">Adicionar</button>
        </div>
        <h3 class="sumido" id="erro-adicionar">Por favor, insira um título.</h3>
    </div>
    <h3 class="sumido" id="sucesso-adicionar">Tarefa adicionada com sucesso!</h3>
    <div class="tarefaAberta sumido">
        <h2 class="titulo-tarefa">Titulo da tarefa</h2>
        <div>
            <h1 id="tempo" class="timer">01:00</h1>
            <h3 id="status">Status</h3>
            <div class="btns-timer">
                <button id="btn-iniciar">Iniciar</button>
                <button id="btn-pausar">Pausar</button>
            </div>
        </div>
        <h3 id="mensagem-final" class="sumido">Tarefa concluída!</h3>
    </div>


    <script src="script.js"></script>
</body>
</html>
